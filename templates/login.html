<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#2a7f8e"/>
  <title>כניסה — גלים ונפש</title>

  <!-- Bootstrap 5 RTL -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"/>
  <!-- Heebo Hebrew font -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap"
        rel="stylesheet"/>

  <style>
    body {
      font-family: 'Heebo', Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      background: #fff;
      padding: 2rem;
    }
    .login-title {
      font-weight: 700;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .biometric-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 500;
      border-radius: 12px;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #999;
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #ddd;
    }
    .divider::before { margin-left: 0.5rem; }
    .divider::after  { margin-right: 0.5rem; }
    .pin-input {
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 0.5rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-title">🌊 גלים ונפש — כניסה</div>

  <!-- Error messages -->
  {% if error == "pin" %}
  <div class="alert alert-danger alert-dismissible fade show" role="alert">
    קוד PIN שגוי
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endif %}

  <!-- Biometric login button (only if credentials registered) -->
  {% if has_biometric %}
  <button id="biometricBtn" class="btn btn-primary biometric-btn" onclick="startBiometricLogin()">
    🔒 כניסה ביומטרית
  </button>

  <div id="biometricStatus" class="text-center mt-2 text-muted" style="display:none;"></div>

  <div class="divider">או</div>
  {% endif %}

  <!-- PIN fallback -->
  <form method="post" action="/auth/login/pin">
    <label class="form-label fw-bold">כניסה עם קוד PIN</label>
    <input type="password"
           name="pin"
           class="form-control pin-input mb-3"
           inputmode="numeric"
           pattern="[0-9]{4,6}"
           maxlength="6"
           placeholder="•••••"
           autocomplete="current-password"
           required/>
    <button type="submit" class="btn btn-outline-primary w-100">כניסה</button>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// --- WebAuthn Biometric Login ---

// Helper: base64url decode to ArrayBuffer
function base64urlToBuffer(base64url) {
  // Add padding
  let padded = base64url + '='.repeat((4 - base64url.length % 4) % 4);
  let binary = atob(padded.replace(/-/g, '+').replace(/_/g, '/'));
  let bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// Helper: ArrayBuffer to base64url
function bufferToBase64url(buffer) {
  let bytes = new Uint8Array(buffer);
  let binary = '';
  for (let b of bytes) binary += String.fromCharCode(b);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function startBiometricLogin() {
  const statusEl = document.getElementById('biometricStatus');
  const btn = document.getElementById('biometricBtn');
  statusEl.style.display = 'block';
  statusEl.textContent = 'מאמת...';
  btn.disabled = true;

  try {
    // 1. Get authentication options from server
    const optRes = await fetch('/auth/webauthn/login/options', { method: 'POST' });
    if (!optRes.ok) throw new Error('Failed to get options');
    const options = await optRes.json();

    // 2. Save challenge token for verification, then convert fields
    var challengeToken = options._challenge_token;
    delete options._challenge_token;
    options.challenge = base64urlToBuffer(options.challenge);
    if (options.allowCredentials) {
      options.allowCredentials = options.allowCredentials.map(c => ({
        ...c,
        id: base64urlToBuffer(c.id),
      }));
    }

    // 3. Call browser WebAuthn API
    const assertion = await navigator.credentials.get({ publicKey: options });

    // 4. Encode response for server (include challenge token)
    const body = {
      id: bufferToBase64url(assertion.rawId),
      rawId: bufferToBase64url(assertion.rawId),
      type: assertion.type,
      _challenge_token: challengeToken,
      response: {
        authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
        clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
        signature: bufferToBase64url(assertion.response.signature),
        userHandle: assertion.response.userHandle
          ? bufferToBase64url(assertion.response.userHandle)
          : null,
      },
    };

    // 5. Verify with server
    const verRes = await fetch('/auth/webauthn/login/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (verRes.ok) {
      window.location.href = '/all-vouchers/view';
    } else {
      const err = await verRes.json();
      statusEl.textContent = 'שגיאה: ' + (err.error || 'Unknown error');
      statusEl.className = 'text-center mt-2 text-danger';
      btn.disabled = false;
    }
  } catch (e) {
    console.error('Biometric login error:', e);
    if (e.name === 'NotAllowedError') {
      statusEl.textContent = 'האימות בוטל';
    } else {
      statusEl.textContent = 'שגיאה באימות ביומטרי';
    }
    statusEl.className = 'text-center mt-2 text-danger';
    btn.disabled = false;
  }
}

// Auto-trigger biometric login if available
{% if has_biometric %}
document.addEventListener('DOMContentLoaded', function() {
  // Small delay to let page render
  setTimeout(startBiometricLogin, 500);
});
{% endif %}
</script>

</body>
</html>
