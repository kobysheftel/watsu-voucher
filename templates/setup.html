<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#2a7f8e"/>
  <title>רישום ביומטרי — גלים ונפש</title>

  <!-- Bootstrap 5 RTL -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"/>
  <!-- Heebo Hebrew font -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap"
        rel="stylesheet"/>

  <style>
    body {
      font-family: 'Heebo', Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .setup-card {
      max-width: 450px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      background: #fff;
      padding: 2rem;
    }
    .setup-title {
      font-weight: 700;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .setup-sub {
      text-align: center;
      color: #666;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="setup-card">
  <div class="setup-title">🔒 רישום אימות ביומטרי</div>

  <div class="setup-sub">
    שלום {{ username }} — הוסף טביעת אצבע, זיהוי פנים או Windows Hello לכניסה מהירה
  </div>

  <button id="registerBtn" class="btn btn-primary w-100 mb-3" style="padding:1rem; font-size:1.1rem; border-radius:12px;"
          onclick="startBiometricRegistration()">
    🔒 רישום אימות ביומטרי
  </button>

  <div id="registerStatus" class="text-center mb-3" style="display:none;"></div>

  <a href="/all-vouchers/view" class="btn btn-outline-secondary w-100" id="skipBtn">
    דלג — כניסה עם PIN בלבד
  </a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Helper: base64url decode to ArrayBuffer
function base64urlToBuffer(base64url) {
  let padded = base64url + '='.repeat((4 - base64url.length % 4) % 4);
  let binary = atob(padded.replace(/-/g, '+').replace(/_/g, '/'));
  let bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// Helper: ArrayBuffer to base64url
function bufferToBase64url(buffer) {
  let bytes = new Uint8Array(buffer);
  let binary = '';
  for (let b of bytes) binary += String.fromCharCode(b);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function startBiometricRegistration() {
  const statusEl = document.getElementById('registerStatus');
  const btn = document.getElementById('registerBtn');
  statusEl.style.display = 'block';
  statusEl.textContent = 'מתחיל רישום...';
  statusEl.className = 'text-center mb-3 text-muted';
  btn.disabled = true;

  try {
    // 1. Get registration options from server
    const optRes = await fetch('/auth/webauthn/register/options', { method: 'POST' });
    if (!optRes.ok) throw new Error('Failed to get options');
    const options = await optRes.json();

    // 2. Convert base64url fields to ArrayBuffer for WebAuthn API
    options.challenge = base64urlToBuffer(options.challenge);
    options.user.id = base64urlToBuffer(options.user.id);
    if (options.excludeCredentials) {
      options.excludeCredentials = options.excludeCredentials.map(c => ({
        ...c,
        id: base64urlToBuffer(c.id),
      }));
    }

    // 3. Call browser WebAuthn API (triggers biometric prompt)
    const credential = await navigator.credentials.create({ publicKey: options });

    // 4. Encode response for server
    const body = {
      id: bufferToBase64url(credential.rawId),
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        attestationObject: bufferToBase64url(credential.response.attestationObject),
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
      },
    };

    // 5. Verify with server
    const verRes = await fetch('/auth/webauthn/register/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (verRes.ok) {
      statusEl.textContent = 'האימות הביומטרי נרשם בהצלחה!';
      statusEl.className = 'text-center mb-3 text-success fw-bold';
      btn.style.display = 'none';
      document.getElementById('skipBtn').textContent = 'המשך לאפליקציה';
      document.getElementById('skipBtn').className = 'btn btn-success w-100';
    } else {
      const err = await verRes.json();
      statusEl.textContent = 'שגיאה: ' + (err.error || 'Unknown error');
      statusEl.className = 'text-center mb-3 text-danger';
      btn.disabled = false;
    }
  } catch (e) {
    console.error('Biometric registration error:', e);
    if (e.name === 'NotAllowedError') {
      statusEl.textContent = 'הרישום בוטל';
    } else if (e.name === 'NotSupportedError') {
      statusEl.textContent = 'הדפדפן לא תומך באימות ביומטרי';
    } else {
      statusEl.textContent = 'שגיאה ברישום: ' + e.message;
    }
    statusEl.className = 'text-center mb-3 text-danger';
    btn.disabled = false;
  }
}
</script>

</body>
</html>
