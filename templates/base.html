<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#2a7f8e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="שוברים"/>
  <link rel="manifest" href="/static/manifest.json"/>
  <link rel="apple-touch-icon" href="/static/icon-192.png"/>
  <title>{% block title %}גלים ונפש — שוברי מתנה{% endblock %}</title>

  <!-- Bootstrap 5 RTL -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"/>

  <!-- Heebo Hebrew font -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap"
        rel="stylesheet"/>

  <style>
    body { font-family: 'Heebo', Arial, sans-serif; background: #f8f9fa; }

    .navbar-brand { font-weight: 700; font-size: 1.25rem; }

    /* Status badge pills */
    .badge-draft { background:#6c757d; color:#fff; padding:2px 10px; border-radius:12px; font-size:.75rem; }
    .badge-sent  { background:#0d6efd; color:#fff; padding:2px 10px; border-radius:12px; font-size:.75rem; }
    .badge-used  { background:#198754; color:#fff; padding:2px 10px; border-radius:12px; font-size:.75rem; }

    /* Stat cards on home page */
    .stat-card {
      border-radius: 14px;
      text-align: center;
      padding: 1.2rem 0.5rem;
      background: #fff;
    }
    .stat-card .stat-num { font-size: 2rem; font-weight: 700; }
    .stat-card .stat-lbl { font-size: .8rem; color: #888; margin-top: 2px; }

    /* Clickable table rows (used in report page) */
    .clickable-row { cursor: pointer; }
    .clickable-row:hover { background-color: #f0f4ff; }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container">
    <a class="navbar-brand" href="/home">🌊 גלים ונפש</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/home">ראשי</a></li>
        <li class="nav-item"><a class="nav-link" href="/orderers/view">מזמינים</a></li>
        <li class="nav-item"><a class="nav-link" href="/all-vouchers/view">שוברים</a></li>
        <li class="nav-item"><a class="nav-link" href="/report/view">דוח</a></li>
        <li class="nav-item"><a class="nav-link text-warning" href="/auth/logout">יציאה</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Flash message (from URL query param: ?flash=...&flash_type=success) -->
{% set flash      = request.query_params.get('flash') %}
{% set flash_type = request.query_params.get('flash_type', 'success') %}
{% if flash %}
<div class="container mb-3">
  <div class="alert alert-{{ flash_type }} alert-dismissible fade show" role="alert">
    {{ flash }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>
{% endif %}

<!-- Page content -->
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS (needed for modals and dismissible alerts) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- PWA Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(function() {});
}
</script>

</body>
</html>
