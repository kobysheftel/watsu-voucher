<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}גלים ונפש — שוברי מתנה{% endblock %}</title>

  <!-- Bootstrap 5 RTL -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"/>

  <!-- Heebo Hebrew font -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap"
        rel="stylesheet"/>

  <style>
    body { font-family: 'Heebo', Arial, sans-serif; background: #f8f9fa; }

    .navbar-brand { font-weight: 700; font-size: 1.25rem; }

    /* Status badge pills */
    .badge-draft { background:#6c757d; color:#fff; padding:2px 10px; border-radius:12px; font-size:.75rem; }
    .badge-sent  { background:#0d6efd; color:#fff; padding:2px 10px; border-radius:12px; font-size:.75rem; }
    .badge-used  { background:#198754; color:#fff; padding:2px 10px; border-radius:12px; font-size:.75rem; }

    /* Stat cards on home page */
    .stat-card {
      border-radius: 14px;
      text-align: center;
      padding: 1.2rem 0.5rem;
      background: #fff;
    }
    .stat-card .stat-num  { font-size: 2rem; font-weight: 700; }
    .stat-card .stat-lbl  { font-size: .8rem; color: #888; margin-top: 2px; }

    /* Clickable table rows */
    .clickable-row { cursor: pointer; }
    .clickable-row:hover { background: #f0f4ff !important; }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/home">🌊 גלים ונפש</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/home">ראשי</a></li>
        <li class="nav-item"><a class="nav-link" href="/report/view">דוח</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Toast notification (top-center) -->
<div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index:9999;">
  <div id="app-toast" class="toast text-white border-0" role="alert" aria-live="assertive">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto"
              data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Page content -->
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  /* Global toast helper — type: success | danger | warning | info */
  function showToast(msg, type) {
    type = type || 'success';
    const el = document.getElementById('app-toast');
    el.className = 'toast text-white border-0 bg-' + type;
    document.getElementById('toast-msg').textContent = msg;
    new bootstrap.Toast(el, { delay: 3500 }).show();
  }

  /* Map status code → Hebrew label */
  const STATUS_HE = { draft: 'טיוטה', sent: 'נשלח', used: 'מומש' };
  const STATUS_CLS = { draft: 'badge-draft', sent: 'badge-sent', used: 'badge-used' };

  function statusBadge(s) {
    return `<span class="${STATUS_CLS[s] || ''}">${STATUS_HE[s] || s}</span>`;
  }
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
